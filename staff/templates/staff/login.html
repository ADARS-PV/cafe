{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Tgarden Staff Login</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <link
        rel="stylesheet"
        href="{% static 'staff/css/staff.css' %}"
    >

</head>


<body class="login-body">


<div class="login-container">

    <div class="login-card">


        <div class="brand-logo">

            🌿

        </div>


        <h1>
            Tgarden
        </h1>


        <p class="login-subtitle">

            Staff Management Portal

        </p>


        <form
            method="POST"
        >

            {% csrf_token %}


            {% if form.non_field_errors %}

                <div class="login-error">

                    Invalid username or password.

                </div>

            {% endif %}


            <div class="input-group">

                <label>
                    Username
                </label>

                {{ form.username }}

            </div>


            <div class="input-group">

                <label>
                    Password
                </label>

                {{ form.password }}

            </div>


            <button
                class="login-button"
                type="submit"
            >

                Sign In

                <span>
                    →
                </span>

            </button>

        </form>


        <p class="login-footer">

            Tgarden Café • Staff Only

        </p>

    </div>

</div>


</body>

</html>
